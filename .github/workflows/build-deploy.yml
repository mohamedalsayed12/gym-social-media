name: CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ format('{0}_test', secrets.DATABASE_NAME) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: update pip
        run: python -m pip install --upgrade pip
      - name: install dependencies
        run: python -m pip install -r requirements.txt
      - name: test with pytest
        run: python -m pytest -q
  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGE == 'true'
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/gymsocialmedia:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
  deploy:
    # Deploys main to the DigitalOcean droplet that serves the live API.
    # Needs repository secrets DROPLET_HOST, DROPLET_USER and DROPLET_SSH_KEY.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: deployment
    needs: [build]
    steps:
      - name: Deploy to droplet over SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          test -n "$DROPLET_HOST" && test -n "$DROPLET_USER" && test -n "$DROPLET_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          # Update the code first so the server always runs the deploy script from main,
          # including on the very first deploy, before deploy.sh exists on the droplet.
          ssh -i ~/.ssh/deploy_key "$DROPLET_USER@$DROPLET_HOST" \
            'cd /home/fastapi/app && git fetch --quiet origin main && git reset --hard origin/main && bash deploy/deploy.sh'
      - name: Check the live API responds
        run: |
          for attempt in 1 2 3 4 5; do
            curl -fsS https://api.music4u.world/openapi.json | grep -q '/workouts/' && exit 0
            sleep 5
          done
          echo "Live API did not expose the latest endpoints" >&2
          exit 1
