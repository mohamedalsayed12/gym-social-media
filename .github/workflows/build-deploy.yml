name: CI/CD

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_HOSTNAME: ${{ secrets.DATABASE_HOSTNAME }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ format('{0}_test', secrets.DATABASE_NAME) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: pulling git repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: update pip
        run: python -m pip install --upgrade pip
      - name: install dependencies
        run: python -m pip install -r requirements.txt
      - name: lint
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests
      - name: test with pytest
        run: python -m pytest -q
  publish_image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_DOCKER_IMAGE == 'true'
    runs-on: ubuntu-latest
    environment: production
    needs: [build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/musicsocialmedia:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"

  build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The API is served under /api on the same domain (see deploy/nginx.conf).
      - run: npm run build
        env:
          VITE_API_URL: /api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    # Deploys main to the DigitalOcean droplet. Needs repository secrets
    # DROPLET_HOST, DROPLET_USER and DROPLET_SSH_KEY (see DEPLOY.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, build_frontend]
    runs-on: ubuntu-latest
    environment: deployment
    concurrency: deploy-droplet
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
      SITE_URL: https://api.music4u.world
    steps:
      - name: Check deploy settings
        run: |
          missing=""
          for name in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing GitHub secrets:$missing. See DEPLOY.md." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
      - name: Update the code on the droplet
        run: |
          ssh -i ~/.ssh/deploy_key "$DROPLET_USER@$DROPLET_HOST" \
            'cd /home/fastapi/app && git fetch --quiet origin main && git reset --hard origin/main'
      - name: Copy the built frontend
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend-dist/ "$DROPLET_USER@$DROPLET_HOST:/home/fastapi/app/frontend-dist.new/"
      - name: Back up, migrate and restart
        run: ssh -i ~/.ssh/deploy_key "$DROPLET_USER@$DROPLET_HOST" 'bash /home/fastapi/app/deploy/deploy.sh'
      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$SITE_URL/openapi.json" | grep -q '"/workouts' \
              && curl -fsS "$SITE_URL/" | grep -qi '<div id="root"'; then
              echo "Live: $SITE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "The live site is not serving the new API and frontend." >&2
          exit 1
