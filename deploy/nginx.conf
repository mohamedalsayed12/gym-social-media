server {
    listen 80;
    listen [::]:80;
    server_name 178.128.32.16 api.music4u.world;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.music4u.world;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://api.music4u.world$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 178.128.32.16;

    ssl_certificate /etc/letsencrypt/live/178.128.32.16/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178.128.32.16/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.music4u.world;

    ssl_certificate /etc/letsencrypt/live/api.music4u.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.music4u.world/privkey.pem;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.music4u.world;

    ssl_certificate /etc/letsencrypt/live/www.music4u.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.music4u.world/privkey.pem;

    return 301 https://api.music4u.world$request_uri;
}
