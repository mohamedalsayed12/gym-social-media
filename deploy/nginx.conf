# Nginx for the Gym Social app on the DigitalOcean droplet.
#
# https://api.music4u.world/            -> React app (built files in /var/www/gym-social)
# https://api.music4u.world/api/...     -> FastAPI on 127.0.0.1:8000 (the /api prefix is removed)
# https://api.music4u.world/docs        -> FastAPI interactive docs
#
# The API sits under /api because the React app has its own /workouts/... pages,
# which would otherwise clash with the API's /workouts routes.

server {
    listen 80;
    listen [::]:80;
    server_name 178.128.32.16 api.music4u.world www.music4u.world;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://api.music4u.world$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 178.128.32.16;

    ssl_certificate /etc/letsencrypt/live/178.128.32.16/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/178.128.32.16/privkey.pem;

    return 301 https://api.music4u.world$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.music4u.world;

    ssl_certificate /etc/letsencrypt/live/www.music4u.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.music4u.world/privkey.pem;

    return 301 https://api.music4u.world$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.music4u.world;

    ssl_certificate /etc/letsencrypt/live/api.music4u.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.music4u.world/privkey.pem;

    root /var/www/gym-social;
    index index.html;

    # Workout photos are up to 5 MB.
    client_max_body_size 6m;

    # The API, with the /api prefix removed (note the trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI's docs page loads /openapi.json from the site root, so both go straight through.
    location = /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built JS and CSS files have a content hash in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the React app; unknown paths fall back to index.html so
    # client-side routes like /workouts/12 work on refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
